# SonarCloud Analysis Configuration for SIGETOUR
# Exclude auto-generated EF Core database migration SQL scripts, database dumps, and minified third-party JS
sonar.exclusions=**/*.sql,**/Migrations/**,**/*.min.js,**/*.min.css,**/wwwroot/lib/**
sonar.cpd.exclusions=**/Migrations/**,**/*.min.js,**/wwwroot/lib/**
